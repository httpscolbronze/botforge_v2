services:
  - type: web
    name: botforge-v2
    env: python
    buildCommand: "./build-render.sh"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: BOTFORGE_HOST
        value: 0.0.0.0
      - key: BOTFORGE_ADMIN_PASSWORD
        generateValue: true
      - key: BOTFORGE_SESSION_SECRET
        generateValue: true
      - key: BOTFORGE_EMBEDDING_FALLBACK
        value: "true"
